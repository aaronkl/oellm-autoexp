# @package _global_
defaults:
  - /backend: megatron_torchdist
  - /container: leonardo
  - /slurm: leonardo
  - /job: default
  - /sweep: none
  - override /backend/megatron: [data_nemotron_cc,moe_200M_A50M]
  - _self_

job:
  base_output_dir: "${.name}"
  name: "moe_hp_grid"
  log_path: "${.name}"
  log_path_current: "${.name}"


slurm:
  sbatch:
    nodes: 4
    time: "10:00:00"

container:
  image: /leonardo_work/OELLM_prod2026/container_images/nemo_25.11.01.sif
  bind: [
     "/leonardo_scratch",
     "/leonardo_work/OELLM_prod2026/"
  ]

backend:
  megatron:
    log_throughput: true
    log_interval: 1
    log_progress: true
    save: ${job.base_output_dir}
    load: ${job.base_output_dir}
    tensorboard_dir: ${job.base_output_dir}/tensorboard
    save_interval: 10000
    wandb_save_dir: "${job.base_output_dir}/wandb"
    wandb_project: "${job.name}"
    wandb_exp_name: "moe_200M_A50M"

    aux:
      tokens: 50_000_000_000  # Default: 50B tokens
    # training schedule. Round numbers to avoid floating point issues
    # set num_tokens to the formula
    # exit_interval: 10000
