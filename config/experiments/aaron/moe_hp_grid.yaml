# @package _global_
defaults:
  - /experiments/base
  - /backend: megatron_torchrun
  - /container: leonardo
  - /slurm: leonardo
  - /monitoring: megatron_basic
  - /project: default
  - /sweep: none 
  - /experiments/aaron/models: moe_200M_A50M
  - /experiments/aaron/data:   moe_ablation_data
  - _self_

project:
  name: moe-exploration
  resume: true
  
slurm:
  sbatch:
    nodes: 4
    time: "10:00:00"

container:
  image: /leonardo_work/OELLM_prod2026/container_images/nemo_25.11.01.sif
  bind: [
     "/leonardo_scratch",
     "/leonardo_work/OELLM_prod2026/"
  ]

sweep:
  base_values:
    project.name: "moe_exploration_\\${backend.megatron.lr}_\\${backend.megatron.global_batch_size}"
  grids:
    - backend.megatron.lr: [0.01, 0.007, 0.005, 0.003]
      backend.megatron.global_batch_size: [256, 512, 1024]
 
backend:
  megatron:
    log_throughput: true
    log_interval: 1
    log_progress: true

    # training schedule. Round numbers to avoid floating point issues
    # set num_tokens to the formula
    train_iters: ${oc.eval:'-(-30_000_000_000 // (${.global_batch_size} * ${.seq_length}))'}
    lr_warmup_iters: ${oc.eval:'min(${.train_iters} // 10, 25000)'}
    lr_wsd_decay_iters: ${oc.eval:'${.train_iters} * 0.2'}
    lr_decay_iters: ${.train_iters}
    # exit_interval: 10000
    save: ${project.base_output_dir}
    load: ${project.base_output_dir}
    tensorboard_dir: ${project.base_output_dir}/tensorboard
    save_interval: 10000
    wandb_save_dir: "${project.base_output_dir}/wandb"
    wandb_project: "${project.name}"
    wandb_exp_name: "moe_200M_A50M_lr${.lr}_gbsz${.global_batch_size}_$SLURM_JOB_ID"

  torchrun_args:
    rdzv_backend: c10d


