# @package _global_
defaults:
  - /backend: megatron_torchrun
  - /container: leonardo
  - /slurm: leonardo
  - /job: default
  - /sweep: none
  - override /backend/megatron: [moe_200M_A50M]
  - _self_

index: 0
stage: ""

job:
  base_output_dir: "${.name}"
  name: "moe_hp_grid"


slurm:
  sbatch:
    nodes: 4
    time: "10:00:00"

container:
        #  image: /leonardo_work/OELLM_prod2026/container_images/nemo_25.11.01.sif
  bind: [
     "/leonardo_scratch",
     "/leonardo_work/OELLM_prod2026/"
  ]

backend:
  megatron:
    log_throughput: true
    log_interval: 1
    log_progress: true
    save: "${job.base_output_dir}/checkpoints/moe_200M_A50M_lr${.lr}_gbsz${.global_batch_size}"
    load: "${job.base_output_dir}/checkpoints/moe_200M_A50M_lr${.lr}_gbsz${.global_batch_size}"
    save_interval: 10000
    data_cache_path: /leonardo_scratch/large/userexternal/aklein00/megatron_cache
    vocab_file: /leonardo_work/OELLM_prod2026/models/EleutherAI/gpt-neox-20b/vocab.json
    merge_file: /leonardo_work/OELLM_prod2026/models/EleutherAI/gpt-neox-20b/merges.txt

    lr: 0.007
    adam_beta2: 0.95
    global_batch_size: 1024
    #    train_iters: "${oc.eval:(50_000_000_000+${.seq_length}*${.global_batch_size}-1)//(${.seq_length}*${.global_batch_size})}"
    train_iters: ${oc.eval:'-(-10_000_000_000 // (${.global_batch_size} * ${.seq_length}))'}
    lr_wsd_decay_iters: ${oc.eval:'${.train_iters} * 0.2'}
    lr_decay_iters: ${.train_iters}
    lr_warmup_iters: ${oc.eval:'min(${.train_iters} // 10, 25000)'}
    #    lr_warmup_iters: 2000
    tensorboard_dir: ${job.base_output_dir}/tensorboard
    wandb_save_dir: "${job.base_output_dir}/wandb"
    wandb_project: "${job.name}"
    wandb_exp_name: "moe_200M_A50M_lr${.lr}_gbsz${.global_batch_size}_beta20.095_ws10p_$SLURM_JOB_ID" 


    # training schedule. Round numbers to avoid floating point issues
    # set num_tokens to the formula
    # exit_interval: 10000
  torchrun_args:
    rdzv_backend: c10d

